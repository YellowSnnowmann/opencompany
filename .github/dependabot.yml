version: 2
updates:
  # Patch bumps are deliberately not proposed (see the `ignore` blocks below).
  # A patch release moves a pin by a digit and buys us nothing we can review:
  # the churn crowds out the minor and major bumps that do carry behaviour
  # worth reading. Minor and major updates still open PRs, and Dependabot
  # security alerts are unaffected by these rules for the advisories it raises
  # itself. If a patch release ever matters, bump it by hand.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
  # Issue #590. This entry predates the SHA pinning sweep, and it is now load
  # bearing rather than routine: every `uses:` in `.github/workflows/` names a
  # full commit SHA, and a pin nobody bumps is a frozen, eventually-unpatched
  # action — the risk pinning was meant to remove, arriving from the other side.
  # Dependabot understands SHA-pinned actions and moves the SHA and its trailing
  # version comment together, which is what turns each upstream release into a
  # reviewable PR. Do not drop this entry while the pins stand.
  #
  # `directory: /` is the whole repo for this ecosystem — Dependabot always scans
  # `.github/workflows/`, so this is not a path that needs widening when a
  # workflow is added. One pin it will NOT reach is
  # `dtolnay/rust-toolchain`: that ref is the head of the `stable` branch, not a
  # release tag, so it has to be re-resolved by hand. See `scripts/ci/assert-actions-pinned.sh`.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
