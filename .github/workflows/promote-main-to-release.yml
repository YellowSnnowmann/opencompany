# Promote main into the long-lived `release` branch, on demand.
#
# This is step one of the release flow (docs/spec/runtime/releases.md):
#
#   promote-main-to-release  →  release-staging  →  release-production
#
# A maintainer dispatches this to take a snapshot of main. It pushes a merge
# commit from main into `release` directly — no PR. The push is made as the
# `tiny-humans-bot` GitHub App, not with GITHUB_TOKEN: `release` is protected by
# the `Protect release` ruleset (repository settings → Rules), which requires a pull
# request for every push and lists the App — and only the App — as an actor
# allowed to bypass that. A push made with GITHUB_TOKEN would be rejected. The
# App's push also fires `push` workflows, so `ci.yml` runs on the promoted
# `release` without an explicit dispatch. Production releases are cut from `release` only;
# staging cuts may come from `main` or `release`. Fixes for anything found on
# `release` are PRs opened against `release`; each cut merges `release` back
# into main so nothing is lost.
#
# Merge, not reset: re-dispatching refreshes `release` with main's latest while
# preserving fix commits already on `release`. When `release` already contains
# main this is a no-op.
#
# Issue #590. Every `uses:` below is a full commit SHA with the resolved version
# in a trailing comment; the rationale is at the top of `ci.yml`.
name: Promote main to release

on:
  workflow_dispatch: {}

# The App token below is what pushes; GITHUB_TOKEN needs nothing beyond read.
permissions:
  contents: read

concurrency:
  group: promote-main-to-release
  cancel-in-progress: false

jobs:
  promote:
    name: Merge main into release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The XGITHUB_APP_* secrets live in this environment, never at repo level.
    # It holds ONLY those two secrets and is branch-policied to `main` and
    # `release`, so no other ref can claim it and a compromised build step
    # elsewhere never sees a token that can bypass the branch rulesets.
    environment: Release-PR-Automation
    steps:
      - name: Guard dispatch ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Dispatch this workflow from main (got $GITHUB_REF). It merges main into release; the ref it runs from is main by definition." >&2
          exit 1

      # Least privilege: this job only pushes the promotion merge commit to
      # `release` — contents: write covers that. It also needs workflows:
      # write: the merge commit can carry changes under `.github/workflows/**`
      # that landed on `main` but not yet on `release`, and GitHub rejects a
      # GitHub App push that touches a workflow file unless the token holds
      # that permission explicitly — a contents-only token fails the push at
      # that point, not at review time. Branch-ruleset bypass comes from the
      # App's identity in the ruleset bypass list, not from token scopes.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.XGITHUB_APP_ID }}
          private-key: ${{ secrets.XGITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # This job PUSHES. `actions/checkout` stores the App token as an
          # `http.extraheader` for this checkout only, which is what `git push`
          # below authenticates with — no token in a remote URL, nothing that
          # `set -x` could ever print. Every other checkout in this repo says
          # `false`; those jobs do not push.
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Merge main into release and push
        run: |
          set -euo pipefail
          log() { echo "[promote] $*"; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          log "main is at $(git rev-parse origin/main)"

          if ! git fetch origin release 2>/dev/null; then
            log "release branch does not exist — bootstrapping it from main"
            git push origin origin/main:refs/heads/release
            log "created release at $(git rev-parse origin/main)"
            echo "promoted=true" >> "$GITHUB_ENV"
            exit 0
          fi
          log "release is at $(git rev-parse origin/release)"

          if git merge-base --is-ancestor origin/main origin/release; then
            log "release already contains main — nothing to promote"
            echo "::notice::release already contains main; no promotion needed."
            echo "promoted=false" >> "$GITHUB_ENV"
            exit 0
          fi

          git checkout -B release origin/release
          if ! git merge origin/main -m "chore(release): merge main into release"; then
            git merge --abort
            echo "::error::main→release merge hit conflicts. Open a fix PR against release (or merge main into release by hand), then re-dispatch." >&2
            exit 1
          fi
          git push origin HEAD:release
          log "release advanced to $(git rev-parse HEAD)"
          echo "promoted=true" >> "$GITHUB_ENV"

      - name: Summarise
        if: env.promoted == 'true'
        run: |
          echo "Promoted main into release; the App push fires ci.yml on release by itself. Next: dispatch **Release Staging** or **Release Production** from the \`release\` branch." >> "$GITHUB_STEP_SUMMARY"
