---
# CI Fast: PRs by tinyhumansai org members run the whole lane flow
# (ci-lanes.yml) in one job on an EX63 Firecracker microVM. That is the Hetzner
# box OpenHuman's CI already runs on, shared through its runner group
# `openhuman-ex63`; the host side is tinyhumansai/gh-hosted-runner. Everyone
# else runs the same lanes on GitHub-hosted runners via ci-fast-hosted.yml, and
# ci-gate.yml turns whichever passes into the one required status, PR CI Gate.
# docs/ci.md has the whole picture.
#
# Why pull_request_target: a pull_request_target run always uses THIS file
# from the base branch, never the PR's copy, so a PR cannot edit the routing
# gate below. The runner group admits only this workflow and ci-lanes.yml at
# refs/heads/main, so a fork's own `pull_request` run (refs/pull/N/merge)
# cannot claim those runners even if it names their label.
#
# The route job never checks out or runs PR code. Only the lane jobs do, only
# for org members, with a read-only token and no secrets; on the EX63 every job
# gets a throwaway microVM whose supervisor re-checks membership.
#
# Kill switch: the EX63 is used only while the repository variable
# `CI_EX63` is `enabled`. Unset (or anything else), every PR, members' too, runs
# on GitHub-hosted runners, so a down or not-yet-provisioned box never leaves a
# PR waiting on a runner that will not come.
name: CI Fast

on:
  pull_request_target:
    branches: [main, release]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    name: Route (org members → EX63)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      member: ${{ steps.member.outputs.member }}
    steps:
      - name: Decide whether the author and pusher are org members
        id: member
        env:
          ENABLED: ${{ vars.CI_EX63 }}
          ORG: ${{ github.repository_owner }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          # Optional fine-grained token with only Organization → Members: Read.
          # Without it, private members are seen only through the PR's author
          # association and may run on GitHub-hosted runners instead.
          MEMBERSHIP_TOKEN: ${{ secrets.CI_MEMBERSHIP_TOKEN }}
        run: |
          set -euo pipefail
          is_member() {
            local login="$1" code
            if [ -n "${MEMBERSHIP_TOKEN}" ]; then
              code="$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${MEMBERSHIP_TOKEN}" \
                -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/orgs/${ORG}/members/${login}")"
              [ "${code}" = "204" ]
              return
            fi
            # No token: only the PR author's association is available.
            [ "${login}" = "${AUTHOR}" ] && { [ "${ASSOCIATION}" = "OWNER" ] || [ "${ASSOCIATION}" = "MEMBER" ]; }
          }
          member=false
          if [ "${ENABLED}" != "enabled" ]; then
            echo "[ci][route] CI_EX63 is '${ENABLED}', not 'enabled': every PR runs on GitHub-hosted runners"
          elif is_member "${AUTHOR}" && is_member "${ACTOR}"; then
            member=true
          fi
          echo "[ci][route] author=${AUTHOR} actor=${ACTOR} association=${ASSOCIATION} token=$([ -n "${MEMBERSHIP_TOKEN}" ] && echo yes || echo no) member=${member}"
          echo "member=${member}" >> "$GITHUB_OUTPUT"

  lanes:
    name: Lanes
    needs: route
    if: needs.route.outputs.member == 'true'
    uses: ./.github/workflows/ci-lanes.yml
    with:
      profile: ex63
      ref: refs/pull/${{ github.event.pull_request.number }}/merge
